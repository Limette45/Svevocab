<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Swedish Word Randomizer</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #222;
    }

    .container {
        max-width: 700px;
        margin: 0 auto;
    }

    h1 {
        font-size: 24px;
        margin-bottom: 20px;
    }

    button,
    input[type="file"] {
        font-size: 16px;
    }

    button {
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        background: #333;
        color: white;
        cursor: pointer;
    }

    button:disabled {
        background: #aaa;
        cursor: default;
    }

    #status {
        margin-bottom: 12px;
        font-size: 14px;
        color: #666;
    }

    #randomButton {
        margin-bottom: 20px;
    }

    .word-list {
        background: white;
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 25px;
    }

    .word-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 0;
        font-size: 18px;
        line-height: 1.5;
        border-bottom: 1px solid #eee;
    }

    .word-row:last-child {
        border-bottom: none;
    }

    .word-content {
        flex: 1;
        min-width: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: normal;
    }

    .swedish-word {
        cursor: pointer;
        user-select: none;
    }

    .swedish-word:hover {
        text-decoration: underline;
    }

    .word-meaning {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    .save-button,
    .saved-copy-button {
        padding: 4px 7px;
        font-size: 12px;
        border-radius: 4px;
        background: #666;
        white-space: nowrap;
        flex-shrink: 0;
    }

    .save-button.saved {
        background: #333;
    }

    .selected-section {
        margin-top: 25px;
    }

    .selected-section h2,
    .saved-section h2 {
        font-size: 19px;
        margin-bottom: 10px;
    }

    #selectedWords,
    #savedWords {
        background: white;
        border-radius: 8px;
        padding: 15px;
        font-size: 18px;
        line-height: 1.6;
        min-height: 40px;
    }

    .selected-word-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 4px 0;
    }

    .selected-word {
        overflow-wrap: anywhere;
        word-break: normal;
        flex: 1;
        min-width: 0;
    }

    .dictionary-buttons {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-shrink: 0;
    }

    .svenska-button,
    .wiktionary-button {
        padding: 4px 7px;
        font-size: 12px;
        border-radius: 4px;
        background: #666;
        white-space: nowrap;
    }

    .saved-section {
        margin-top: 25px;
    }

    .saved-word-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid #eee;
    }

    .saved-word-row:last-child {
        border-bottom: none;
    }

    .saved-word-content {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
        word-break: normal;
    }

    .saved-meaning {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    .saved-spacer {
        white-space: pre;
    }

    .file-section {
        margin-top: 40px;
        padding-top: 20px;
        border-top: 1px solid #ccc;
    }

    .file-section label {
        display: block;
        margin-bottom: 8px;
        font-size: 15px;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Swedish Word Randomizer</h1>

    <div id="status"></div>

    <div id="wordList" class="word-list"></div>

    <button id="randomButton">Random 10</button>

    <div class="selected-section">
        <h2>Selected words</h2>
        <div id="selectedWords"></div>
    </div>

    <div class="saved-section">
        <h2>Saved words</h2>
        <div id="savedWords"></div>
    </div>

    <div class="file-section">
        <label for="fileInput">Select TXT file</label>
        <input type="file" id="fileInput" accept=".txt">
    </div>

</div>

<script>
const STORAGE_KEY_WORDS =
    "swedishWordRandomizer_7f3a9c_words";

const STORAGE_KEY_USED =
    "swedishWordRandomizer_7f3a9c_used";

const STORAGE_KEY_CURRENT =
    "swedishWordRandomizer_7f3a9c_current";

const STORAGE_KEY_FILENAME =
    "swedishWordRandomizer_7f3a9c_filename";

const STORAGE_KEY_SAVED =
    "swedishWordRandomizer_7f3a9c_saved";

let words = [];
let usedWords = [];
let currentSelected = [];
let savedWords = [];
let fileName = "";

const fileInput =
    document.getElementById("fileInput");

const randomButton =
    document.getElementById("randomButton");

const wordList =
    document.getElementById("wordList");

const selectedWords =
    document.getElementById("selectedWords");

const savedWordsContainer =
    document.getElementById("savedWords");

const status =
    document.getElementById("status");


function loadStorage() {
    try {
        const savedWordsData =
            localStorage.getItem(STORAGE_KEY_WORDS);

        const savedUsed =
            localStorage.getItem(STORAGE_KEY_USED);

        const savedCurrent =
            localStorage.getItem(STORAGE_KEY_CURRENT);

        const savedFileName =
            localStorage.getItem(STORAGE_KEY_FILENAME);

        const savedData =
            localStorage.getItem(STORAGE_KEY_SAVED);

        if (savedWordsData) {
            words = JSON.parse(savedWordsData);
        }

        if (savedUsed) {
            usedWords = JSON.parse(savedUsed);
        }

        if (savedFileName) {
            fileName = savedFileName;
        }

        if (savedCurrent) {
            const savedCurrentWords =
                JSON.parse(savedCurrent);

            const wordMap =
                new Map(
                    words.map(item => [
                        item.word,
                        item
                    ])
                );

            currentSelected =
                savedCurrentWords
                    .map(word => wordMap.get(word))
                    .filter(Boolean);
        }

        if (savedData) {
            savedWords = JSON.parse(savedData);
        }

    } catch {
        words = [];
        usedWords = [];
        currentSelected = [];
        savedWords = [];
        fileName = "";
    }
}


function saveStorage() {
    localStorage.setItem(
        STORAGE_KEY_WORDS,
        JSON.stringify(words)
    );

    localStorage.setItem(
        STORAGE_KEY_USED,
        JSON.stringify(usedWords)
    );

    localStorage.setItem(
        STORAGE_KEY_CURRENT,
        JSON.stringify(
            currentSelected.map(item => item.word)
        )
    );

    localStorage.setItem(
        STORAGE_KEY_FILENAME,
        fileName
    );

    localStorage.setItem(
        STORAGE_KEY_SAVED,
        JSON.stringify(savedWords)
    );
}


function parseLine(line) {
    line = line
        .replace(/\uFEFF/g, "")
        .replace(/\u3000/g, " ")
        .replace(/\t+/g, " ")
        .trim();

    if (!line) {
        return null;
    }

    const posMatch =
        line.match(
            /\((Adv|Adj|N|V|Pron|Prep|Conj|Num|Interj|Det|Part|Art)\s*$/i
        );

    if (!posMatch) {
        return {
            word: line,
            meaning: ""
        };
    }

    const posStart = posMatch.index;

    const beforePos =
        line.slice(0, posStart).trim();

    const separatorMatch =
        beforePos.match(/\s{2,}/);

    if (!separatorMatch) {
        return {
            word: beforePos,
            meaning: "(" + posMatch[1]
        };
    }

    const separatorIndex =
        separatorMatch.index;

    const word =
        beforePos
            .slice(0, separatorIndex)
            .trim();

    const meaning =
        beforePos
            .slice(separatorIndex)
            .trim();

    return {
        word: word,
        meaning: meaning + "(" + posMatch[1]
    };
}


function parseText(text) {
    const lines = text.split(/\r?\n/);
    const result = [];

    for (const line of lines) {
        const item = parseLine(line);

        if (item && item.word) {
            result.push(item);
        }
    }

    return result;
}


function getUsedWordSet() {
    return new Set(usedWords);
}


function updateButtonState() {
    const usedSet = getUsedWordSet();

    const remaining = words.filter(
        item => !usedSet.has(item.word)
    );

    randomButton.disabled =
        remaining.length === 0;

    const total =
        new Set(words.map(item => item.word)).size;

    const completed =
        new Set(
            usedWords.filter(
                word => words.some(item => item.word === word)
            )
        ).size;

    const percentage =
        total > 0
            ? (completed / total * 100)
                .toFixed(1)
                .replace(/\.0$/, "")
            : "0";

    if (words.length === 0) {
        status.textContent =
            "Select a TXT file below.";
    } else {
        status.textContent =
            remaining.length +
            " words remaining. " +
            percentage +
            "% completed";
    }
}


function getDictionaryWord(word) {
    return word
        .replace(/^\((en|ett)\)\s+/i, "")
        .replace(/^(en|ett)\s+/i, "")
        .trim();
}


function openSvenska(word) {
    const dictionaryWord = getDictionaryWord(word);

    const url =
        "https://svenska.se/?activeTab=alla&q=" +
        encodeURIComponent(dictionaryWord);

    window.open(url, "_blank");
}


function openWiktionary(word) {
    const dictionaryWord = getDictionaryWord(word);

    const url =
        "https://en.wiktionary.org/wiki/" +
        encodeURIComponent(dictionaryWord);

    window.open(url, "_blank");
}


function speakWord(word) {
    if (!("speechSynthesis" in window)) {
        status.textContent =
            "Speech synthesis is not supported by this browser.";
        return;
    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(word);

    utterance.lang = "sv-SE";
    utterance.rate = 0.9;

    utterance.onerror = () => {
        status.textContent =
            "Unable to play audio. Check your browser's speech settings.";
    };

    window.speechSynthesis.speak(utterance);
}


function isSaved(word) {
    return savedWords.some(
        item => item.word === word
    );
}


function toggleSaved(item) {
    if (isSaved(item.word)) {
        savedWords = savedWords.filter(
            saved => saved.word !== item.word
        );
    } else {
        savedWords.push({
            word: item.word,
            meaning: item.meaning
        });
    }

    saveStorage();
    renderResults();
}


function createSaveButton(item) {
    const saveButton =
        document.createElement("button");

    saveButton.className = "save-button";

    const saved = isSaved(item.word);

    saveButton.textContent =
        saved ? "Unsave" : "Save";

    saveButton.classList.toggle(
        "saved",
        saved
    );

    saveButton.addEventListener(
        "click",
        () => toggleSaved(item)
    );

    return saveButton;
}


function renderSelected() {
    selectedWords.innerHTML = "";

    currentSelected.forEach(item => {
        const row =
            document.createElement("div");

        row.className = "selected-word-row";

        const word =
            document.createElement("span");

        word.className = "selected-word";
        word.textContent = item.word;

        const buttons =
            document.createElement("div");

        buttons.className = "dictionary-buttons";

        const svenskaButton =
            document.createElement("button");

        svenskaButton.className = "svenska-button";
        svenskaButton.textContent = "Svenska.se";

        svenskaButton.addEventListener(
            "click",
            () => openSvenska(item.word)
        );

        const wiktionaryButton =
            document.createElement("button");

        wiktionaryButton.className = "wiktionary-button";
        wiktionaryButton.textContent = "Wiktionary";

        wiktionaryButton.addEventListener(
            "click",
            () => openWiktionary(item.word)
        );

        buttons.appendChild(svenskaButton);
        buttons.appendChild(wiktionaryButton);

        row.appendChild(word);
        row.appendChild(buttons);

        selectedWords.appendChild(row);
    });
}


function renderSaved() {
    savedWordsContainer.innerHTML = "";

    savedWords.forEach(item => {
        const row =
            document.createElement("div");

        row.className = "saved-word-row";

        const content =
            document.createElement("div");

        content.className = "saved-word-content";

        const word =
            document.createElement("span");

        word.textContent = item.word;

        content.appendChild(word);

        if (item.meaning) {
            const spacer =
                document.createElement("span");

            spacer.className = "saved-spacer";
            spacer.textContent = "        ";

            content.appendChild(spacer);

            const meaning =
                document.createElement("span");

            meaning.className = "saved-meaning";
            meaning.textContent = item.meaning;

            content.appendChild(meaning);
        }

        const copyButton =
            document.createElement("button");

        copyButton.className = "saved-copy-button";
        copyButton.textContent = "Copy";

        copyButton.addEventListener(
            "click",
            async () => {
                try {
                    await navigator.clipboard.writeText(
                        item.word
                    );
                } catch {
                    const textarea =
                        document.createElement("textarea");

                    textarea.value = item.word;

                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand("copy");
                    textarea.remove();
                }

                copyButton.textContent = "Copied";

                setTimeout(() => {
                    copyButton.textContent = "Copy";
                }, 1000);
            }
        );

        row.appendChild(content);
        row.appendChild(copyButton);

        savedWordsContainer.appendChild(row);
    });
}


function renderResults() {
    wordList.innerHTML = "";

    currentSelected.forEach(item => {
        const row =
            document.createElement("div");

        row.className = "word-row";

        const content =
            document.createElement("div");

        content.className = "word-content";

        const word =
            document.createElement("span");

        word.className = "swedish-word";
        word.textContent = item.word;

        word.addEventListener(
            "click",
            () => speakWord(item.word)
        );

        content.appendChild(word);

        if (item.meaning) {
            content.appendChild(
                document.createTextNode("       ")
            );

            const meaning =
                document.createElement("span");

            meaning.className = "word-meaning";
            meaning.textContent = item.meaning;

            content.appendChild(meaning);
        }

        row.appendChild(content);
        row.appendChild(createSaveButton(item));

        wordList.appendChild(row);
    });

    renderSelected();
    renderSaved();
}


function selectRandomWords() {
    const usedSet = getUsedWordSet();

    const remaining = words.filter(
        item => !usedSet.has(item.word)
    );

    if (remaining.length === 0) {
        currentSelected = [];

        saveStorage();
        renderResults();
        updateButtonState();

        return;
    }

    const shuffled = [...remaining];

    for (let i = shuffled.length - 1; i > 0; i--) {
        const j =
            Math.floor(Math.random() * (i + 1));

        [shuffled[i], shuffled[j]] =
            [shuffled[j], shuffled[i]];
    }

    currentSelected = shuffled.slice(0, 10);

    currentSelected.forEach(item => {
        if (!usedSet.has(item.word)) {
            usedWords.push(item.word);
        }
    });

    saveStorage();

    renderResults();
    updateButtonState();
}


randomButton.addEventListener(
    "click",
    selectRandomWords
);


fileInput.addEventListener(
    "change",
    event => {
        const file = event.target.files[0];

        if (!file) {
            return;
        }

        const reader = new FileReader();

        reader.onload = event => {
            const text = event.target.result;

            words = parseText(text);

            const currentWordSet =
                new Set(words.map(item => item.word));

            usedWords = usedWords.filter(
                word => currentWordSet.has(word)
            );

            currentSelected = [];
            savedWords = [];
            fileName = file.name;

            saveStorage();

            renderResults();
            updateButtonState();
        };

        reader.readAsText(file);
    }
);


loadStorage();
renderResults();
updateButtonState();
</script>

</body>
</html>
